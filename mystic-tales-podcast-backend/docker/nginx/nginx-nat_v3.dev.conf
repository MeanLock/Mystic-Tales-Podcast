worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    # ============================================
    # CRITICAL: Backend Connection Pool
    # ============================================
    upstream api_gateway_cluster {
        server api-gateway-service-1:8041;
        server api-gateway-service-2:8041;
        server api-gateway-service-3:8041;

        least_conn;
        
        # 🔥 THIS IS THE KEY FIX 🔥
        # Each Nginx worker needs enough connections to each backend
        # Formula: keepalive = (worker_connections / upstream_servers) / 2
        # Example: (10000 / 3) / 2 = ~1666
        keepalive 2000;              # ← MASSIVELY INCREASED
        keepalive_timeout 60s;
        keepalive_requests 10000;    # Reuse connections more
    }
    
    # Disable rate limiting for testing
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10000r/m;
    
    # ============================================
    # HTTP Server (Port 80) - Local Development
    # ============================================
    server {
        # 🔥 CRITICAL: Increase connection queue
        listen 80 backlog=65535;  # ← INCREASED from default 511
        server_name localhost;
        
        # ============================================
        # API Gateway Proxy (Main traffic)
        # ============================================
        location / {
            proxy_pass http://api_gateway_cluster;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_http_version 1.1;
            
            # ============================================
            # INCREASE TIMEOUTS (was 5s/60s/60s)
            # ============================================
            proxy_connect_timeout 10s;     # ← Increased from 5s
            proxy_send_timeout 120s;       # ← Increased from 60s
            proxy_read_timeout 120s;       # ← Increased from 60s
            
            # ============================================
            # INCREASE RETRY SETTINGS
            # ============================================
            proxy_next_upstream error timeout http_502 http_503 http_504;  # ← Added more retry conditions
            proxy_next_upstream_tries 3;   # ← Increased from 2
            proxy_next_upstream_timeout 10s;  # ← Increased from 3s
            
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # ============================================
        # Health Check Endpoint
        # ============================================
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # ============================================
    # Logging
    # ============================================
    access_log off;  # Disable for performance
    error_log /var/log/nginx/error.log error;  # Only errors
}