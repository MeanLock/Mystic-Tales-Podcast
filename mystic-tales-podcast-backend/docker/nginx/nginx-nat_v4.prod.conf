worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 10000;
    use epoll;
    multi_accept on;
}

http {
    # ============================================
    # CRITICAL: File Upload Limits
    # ============================================
    client_max_body_size 500M;      # Max file upload size
    client_body_timeout 300s;       # Timeout for receiving body
    client_body_buffer_size 128k;   # Buffer size

    # ============================================
    # WebSocket Support
    # ============================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    
    # ============================================
    # Backend Connection Pool
    # ============================================
    upstream api_gateway_cluster {
        server api-gateway-service-1:8041;
        server api-gateway-service-2:8041;
        server api-gateway-service-3:8041;

        least_conn;
        keepalive 2000;
        keepalive_timeout 60s;
        keepalive_requests 10000;
    }
    
    # ============================================
    # HTTP Server (Port 80) - Redirect to HTTPS
    # ============================================
    server {
        listen 80 backlog=65535;
        server_name api-gateway.mystic-tales-podcast.xyz;
        
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
    
    # ============================================
    # HTTPS Server (Port 443) - NO HTTP2!
    # ============================================
    server {
        # ⚠️ REMOVED http2 - It interferes with WebSocket
        listen 443 ssl backlog=65535;
        server_name api-gateway.mystic-tales-podcast.xyz;
        
        # ============================================
        # SSL Configuration
        # ============================================
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # ============================================
        # Main Location - Handles BOTH HTTP and WebSocket
        # ============================================
        location / {
            proxy_pass http://api_gateway_cluster;
            
            # Standard Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # ============================================
            # WebSocket Support
            # ============================================
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Retry settings
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # ============================================
        # Health Check
        # ============================================
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
    
    # ============================================
    # Logging
    # ============================================
    access_log off;
    error_log /var/log/nginx/error.log error;
}